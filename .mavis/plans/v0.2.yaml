tasks:
  - id: day6-mcp
    title: "Day 6 — MCP protocol adapters (client + server + registry routing)"
    assigned_to: coder
    role: produce
    verified_by: verifier
    depends_on: []
    gates: []
    max_retries: 2
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000
    prompt: |
      You are the producer for **Day 6** of hello-agent-2 v0.2. v0.1 is shipped;
      you continue on the same branch `wt/e5bdcb08`.

      ## Source of truth (READ FIRST)
      - `docs/ENGINEERING.md` (3916 lines, the canonical brief — wins over this prompt)
      - `docs/v0.2-PLAN.md` (this version's day-by-day contract)

      ## Working directory
      `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08`

      ## What to build (Day 6 — MCP)

      ### A. `hello_agent/protocols/`
      Per `docs/ENGINEERING.md` §6.x (the existing skeleton has only `__init__.py`):
      - `mcp_client.py` — `MCPClient(cmd, args, cwd=None)`: spawn subprocess, JSON-RPC stdio
        handshake (initialize / initialized), `list_tools()`, `call_tool(name, args)`,
        clean shutdown. Lazy-imports `mcp` to keep core deps light.
      - `mcp_server.py` — stdio MCP server exposing all 11 built-in tools from
        `hello_agent.tools.builtin` (document_parser, file_tools, shell_tool,
        web_search, web_fetch, todowrite, notify, task_tool, mcp_* etc.). Tool
        results JSON-serialized, errors return `ERROR: <msg>\n<hint>` text.

      ### B. `hello_agent/cli/mcp.py` (NEW)
      Typer subcommands:
      - `hello-agent mcp serve` — runs the stdio server
      - `hello-agent mcp connect -- <cmd> [args...]` — consumes an external MCP
        server and registers its tools into the live `ToolRegistry`

      ### C. `hello_agent/tools/registry.py` (UPDATE)
      - `register_mcp_server(client: MCPClient)` adds remote tools to the registry
      - `execute(name, args, session_id)` routes to MCP when tool is remote
      - Circuit-breaker applies across MCP calls (existing `CircuitBreaker`)

      ### D. Tests (`tests/test_protocols/`)
      - `test_mcp_client.py` — mock MCP server fixture (an in-process script that
        responds to JSON-RPC); test `list_tools()` + `call_tool()` round-trip
      - `test_mcp_server.py` — spawn the stdio server, send init + tools/list +
        tools/call, parse responses
      - `test_registry_mcp_integration.py` — registry routes correctly when tool
        is MCP-backed

      ## Workflow rules
      Same as v0.1: PowerShell on Windows, ruff after each module, smoke-after-each,
      no `pyproject.toml` dep changes without OK, no LangChain.

      ## Commit & push
      ```
      git add -A
      git commit -m "feat(day6): MCP client + server (stdio JSON-RPC, registry routing)"
      git push origin wt/e5bdcb08
      ```

      ## Deliverable
      1. All §A / §B / §C / §D files exist and import cleanly
      2. `uv run ruff check hello_agent/ scripts/ tests/` passes
      3. `uv run pytest tests/test_protocols/ -q` passes
      4. `uv run pytest -q` (full suite) passes — 215+ prior + new
      5. New commit on `wt/e5bdcb08`, pushed to origin
      6. Final report at `.mavis/plans/day6-mcp-deliverable.md`
    verify_prompt: |
      You are the verifier for **Day 6 — MCP**.

      Working dir: `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08`

      ## Re-verify (do NOT trust producer)

      1. **All §A / §B / §C files** exist with non-empty content
      2. **No regressions** — `hello_agent/agents/`, `tools/`, `core/`, `cli/`,
