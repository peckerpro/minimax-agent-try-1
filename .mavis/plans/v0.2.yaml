      ## What to build (Day 8 — Web UI)

      ### A. `hello_agent/web/` (FastAPI backend)
      Per `docs/ENGINEERING.md` §6.x `web/` and §7.x "Web UI":
      - `server.py` — FastAPI app, lifespan hook creates `ToolRegistry` +
        `LLMClient` + `ReActAgent`; CORS for `127.0.0.1:8648`; `/api/health`
        returns 200; mounts `static/` (built React assets) at root
      - `routes/chat.py` — `POST /api/chat/` (blocking) + `GET /api/chat/stream`
        (SSE). SSE events: `token`, `tool_call`, `tool_result`, `final`, `error`
      - `routes/sessions.py` — `GET /api/sessions/` (list), `GET /api/sessions/:id`,
        `POST /api/sessions/:id/resume`
      - `routes/skills.py` — `GET /api/skills/`, `GET /api/skills/:name`,
        `POST /api/skills/install` (multipart upload)
      - `routes/tools.py` — `GET /api/tools/`, `POST /api/tools/:name/enable`,
        `POST /api/tools/:name/disable`
      - `routes/config.py` — `GET /api/config/`, `PUT /api/config/` (write back
        to config.yaml)

      ### B. `web-ui/` (React + Vite + TypeScript)
      New directory at repo root:
      - `package.json`, `tsconfig.json`, `vite.config.ts`, `index.html`
      - `src/main.tsx`, `App.tsx`
      - `src/api/client.ts` (axios), `api/types.ts`
      - `src/components/ChatPanel.tsx` (message list + input + SSE consumer)
      - `src/components/ToolCallCard.tsx` (collapsible tool call display)
      - `src/components/Sidebar.tsx` (sessions list + new chat)
      - `src/components/SkillsPanel.tsx`, `MemoryPanel.tsx`, `ConfigPanel.tsx`
      - `src/hooks/useChatStream.ts` (SSE consumer)
      - `src/hooks/useSession.ts`, `useTools.ts`
      - `src/store/{chat,session,config}.ts` (nanostores)
      - `src/styles/globals.css` (dark theme + monospace)
      - `.gitignore` (`dist/`, `node_modules/`)

      Build pipeline: `cd web-ui && npm install && npm run build` produces
      `web-ui/dist/`. The FastAPI server mounts the `dist/` contents at
      `hello_agent/web/static/` (a build step or a symlink — your call;
      document the chosen approach in the deliverable).

