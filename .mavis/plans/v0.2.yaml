         exits 0
      4. **Tests** — `uv run pytest tests/test_protocols/ -q` exits 0, ≥3 test files
      5. **Full suite** — `uv run pytest -q` exits 0 (215+ prior tests still green)
      6. **Ruff** — `uv run ruff check hello_agent/ scripts/ tests/` exits 0
      7. **Day 1-5 still green** — re-run prior day test suites individually
      8. **Smoke** — write a quick script that connects to the stdio server
