      `hello-agent serve` starts uvicorn + (optionally) tray thread; handles
      SIGINT/SIGTERM to clean up both. `--no-tray` and `--no-hotkey` flags
      for headless / CI use.

      ### C. `hello_agent/cli/autostart.py` (NEW)
      `hello-agent autostart {enable,disable,status}` — thin CLI over
      `windows/autostart.py`.

      ### D. `hello_agent/assets/tray.png` (NEW)
      16x16 PNG. Generate with Pillow if no designer asset is available:
      solid color or simple icon.

