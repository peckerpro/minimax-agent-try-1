      ## What to build (Day 9 — Windows integration)

      ### A. `hello_agent/windows/`
      Per `docs/ENGINEERING.md` §6.x `windows/`:
      - `tray.py` — `pystray` icon (16x16 PNG from `assets/tray.png`, or
        generated default); menu items:
        - "Show Web UI" → `webbrowser.open("http://127.0.0.1:8648")`
        - "Status" → mini popup with uptime + active session count
        - "Quit" → clean shutdown of uvicorn + tray thread
      - `autostart.py` — `enable_autostart()` writes
        `HKCU\Software\Microsoft\Windows\CurrentVersion\Run\hello-agent`
        = `uv --directory <repo> run hello-agent serve --no-tray`;
        `disable_autostart()` deletes; `is_autostart_enabled()` checks
      - `env.py` — `probe_env()` returns dict of {python_version, uv_version,
        llm_api_key_set, network_reachable}; consumed by `hello-agent doctor`
      - `shortcuts.py` (stretch, optional) — global hotkey via `keyboard` lib;
        lazy-imported; `--no-hotkey` flag to skip

