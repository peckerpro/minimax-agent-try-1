      - `test_autostart.py` — mock `winreg`; test enable/disable/status
        round-trip + idempotency
      - `test_env.py` — probe each env var; assert graceful failure when missing
      - Mark all `windows/` tests with `@pytest.mark.windows` and skip on
        non-Windows

      ## Commit & push
