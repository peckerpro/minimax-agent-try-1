      ## What to build (Day 7 — Skills)

      ### A. `hello_agent/skills/`
      Per `docs/ENGINEERING.md` §6.x (skeleton exists):
      - `loader.py` — `load_skill(name) -> Skill`; scans `~/.hello_agent/skills/*.md`
        AND `hello_agent/skills/builtin/*.md`; parses YAML frontmatter
        (`name`, `description`, `triggers`, `tools`, `inputs`, `outputs`) + Markdown
        body (must have `## Procedure` section; optional `## Examples`,
        `## Constraints`)
      - `registry.py` — `SkillRegistry`; trigger matching (regex from
        `triggers.regex` + keyword match from `triggers.keywords`); per-session
        activation (skills in `~/.hello_agent/skills/active/<session>.txt`)
      - `Skill` / `SkillFrontmatter` dataclasses

      ### B. `hello_agent/skills/builtin/`
      Three SKILL.md files, each with valid frontmatter + Procedure section:
      - `file_organize.md` — categorize files in a folder; use `file_tools.read_file`
        to scan, `file_tools.write_file` (with confirmation) to move
      - `daily_review.md` — read session DB, summarize the day, write to Obsidian
      - `obsidian_lookup.md` — search obsidian vault for related notes

      ### C. `hello_agent/agents/react.py` (UPDATE)
      Inject active skills into system prompt as `<available_skills>` block before
      each LLM call. Don't change the iteration loop itself.

      ### D. `hello_agent/cli/skills.py` (NEW)
      - `hello-agent skills list` — show all loaded skills (name + description)
      - `hello-agent skills show <name>` — print full SKILL.md (frontmatter + body)
      - `hello-agent skills install <path>` — copy SKILL.md into
        `~/.hello_agent/skills/`

