  - id: day4-context-mem
    title: "Day 4 — Context engineering (history/token_counter/truncator/builder) + Memory (short/long/episodic) + smoke"
    assigned_to: coder
    role: produce
    verified_by: verifier
    depends_on:
      - day3-react-loop
    gates: []
    max_retries: 2
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000
    prompt: |
      You are the producer for **Day 4** of hello-agent-2 v0.1.

      Read ENGINEERING.md §6.5 (context) + §6.6 (memory) + §7.3
      (Obsidian sync — defer the actual sync, but design the schema).

      ## What to build

      ### A. `hello_agent/context/` — context engineering
      Per §6.5:
      - `history.py` — `HistoryManager` (sliding window,
        `max_messages=50` from config.yaml `memory.short_term.max_messages`).
        Supports per-message flags (compressed, truncated, system, tool).
      - `token_counter.py` — `tiktoken` based counter. Falls back to a
        char/4 heuristic if tiktoken missing.
      - `truncator.py` — `ObservationTruncator` with strategies
        `head_tail` (default), `middle_out`, `summarize`.
      - `builder.py` — `ContextBuilder` that assembles system + history
        + RAG chunks + memory recall into a single messages list. Honors
        `context.max_context_tokens=128000` and
        `context.response_reserve_tokens=4000`.

      ### B. `hello_agent/memory/` — memory subsystem
      Per §6.6:
      - `short_term.py` — wraps `HistoryManager`. (Could just re-export.)
      - `long_term.py` — SQLite-backed facts (user prefs, project
        context). Path: `~/.hello-agent/memory/long_term.db` (per
        config.yaml). Schema: `facts(id, key, value, source, created_at, updated_at)`.
        Use stdlib `sqlite3`, no ORM.
      - `episodic.py` — past task summaries. Schema:
        `episodes(id, session_id, summary, created_at)`. `summarize_every_n_turns=20`.

      ### C. `scripts/smoke_context.py`
      - Smoke `TokenCounter` (mock a Message, count tokens).
      - Smoke `HistoryManager` sliding window (push 60 messages,
        assert len == 50).
      - Smoke `Truncator.head_tail` (truncate a 1000-line string).
      - Smoke `ContextBuilder` end-to-end (with all features disabled
        in config, should just return system + history).

      ### D. `tests/test_context/` + `tests/test_memory/`
      - `test_history.py`, `test_token_counter.py`, `test_truncator.py`,
        `test_builder.py`.
      - `test_long_term.py` — set/get round-trip on a tmp db.
      - `test_episodic.py` — insert + query round-trip.

      ## Workflow
      Same as Day 1-3.

      ## Commit & push
      ```
      git add -A
      git commit -m "feat(day4): context engineering + short/long/episodic memory"
