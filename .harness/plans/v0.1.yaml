      3. **Imports** — `uv run python -c "from hello_agent.agents.react import ReActAgent; from hello_agent.agents.plan_solve import PlanAndSolveAgent; from hello_agent.agents.reflection import ReflectionAgent; from hello_agent.agents.router import TaskRouter"` exits 0.
      4. **Smoke** — `uv run python scripts/smoke_agents.py` exits 0.
      5. **CLI** — `uv run hello-agent run --agent-type simple "ping"`
         exits 0 (with or without API key — must not crash).
      6. **Ruff** — `uv run ruff check hello_agent/ scripts/ tests/` exits 0.
      7. **Pytest** — `uv run pytest tests/test_agents/ -q` exits 0.
         ≥3 distinct test files (test_simple, test_react, test_router).
      8. **Day 1-2 still green** — re-run all previous pytest suites.
      9. **Git** — new day-3 commit, pushed to origin.
      10. **Hermes borrowing map (§5) alignment** — spot-check that
