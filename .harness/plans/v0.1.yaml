version: 1

plan:
  name: "hello-agent-2 · v0.1 (5-day backbone)"
  max_concurrency: 1
  max_consecutive_failures: 2
  max_cycles: 12
  auto_accept: true
  auto_reject_retries: 2
  verifier_config:
    default_verifiers:
      - verifier
    audit_sample_rate: 0
    strict_mode: false

# Global context for every task. The producer MUST read ENGINEERING.md
# before writing any code. The verifier MUST read it before grading.
context:
  workspace: D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08
  eng_doc: D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\docs\ENGINEERING.md
  reins_root: D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\.harness\reins
  github_remote: https://github.com/peckerpro/minimax-agent-try-1.git
  branch: wt/e5bdcb08
  user_policies:
    - "Tight feedback loops: smoke after each module, not at the end"
    - "Author → reviewer → fix → push runs without user check-in"
    - "User does not review until a milestone (v0.1) is done"
    - "Exact-pinned deps; PLW1514 enforcement; no LangChain"
    - "ENGINEERING.md is the single source of truth; deviations must be surfaced to the user, not silently made"

tasks:
  - id: day1-scaffold
    title: "Day 1 — uv sync + hello_agent/core/ + SimpleAgent + CLI chat"
    assigned_to: coder
    role: produce
    verified_by: verifier
    depends_on: []
    gates: []
    max_retries: 2
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000
    prompt: |
      You are the **producer** for Day 1 of the hello-agent-2 v0.1 backbone plan.

      ## Source of truth (READ FIRST)
      `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\docs\ENGINEERING.md`
      is the canonical engineering brief. **The brief wins over any other
      doc.** The repo already has `pyproject.toml` (exact-pinned deps, §4.1),
      `.env.example` (§4.2), `config.yaml` (§4.3), `.gitignore` (§4.4),
      `.python-version` (§4.5), `LICENSE`, `README.md`, plus
      `hello_agent/__init__.py` + `hello_agent/__main__.py` + `hello_agent/core/__init__.py` skeleton.

      ## Working directory
      All paths below are relative to the worktree root
      `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08`.
      Do not write outside this tree.

      ## What to build (Day 1)

      ### A. `hello_agent/core/` — foundational abstractions
      Per ENGINEERING.md §6.1 + §6.2:
      - `core/config.py` — pydantic-settings loader for config.yaml + .env
        (use `HELLO_AGENT_HOME`, `HELLO_AGENT_PROFILE` env). MUST honor
        profile-aware paths.
      - `core/llm.py` — thin OpenAI-compatible client (sync + async +
        streaming). Honors `LLM_BASE_URL` / `LLM_API_KEY` / `LLM_MODEL` /
        `LLM_TIMEOUT_SECONDS` / `LLM_MAX_RETRIES` from env or config.yaml.
        Use `tenacity` for retries; raise `LLMError` on hard failure.
      - `core/types.py` — `Message`, `ToolCall`, `ToolResult`, `AgentState`,
        `ToolResponse` dataclasses (see §6.2 types.py).
      - `core/logging.py` — `loguru` setup, profile-aware paths, 3 files
        (agent / tools / llm) per `logging.files` in config.yaml.
      - `core/paths.py` — `get_hello_agent_home()` (defaults to
        `~/.hello-agent`, honors `HELLO_AGENT_HOME` and `HELLO_AGENT_PROFILE`).
        **CRITICAL: `hello_agent/__init__.py` already calls
        `core.paths._apply_profile_override()` at import time — implement
        that function so the import works.**
      - `core/exceptions.py` — `HelloAgentError` hierarchy (`LLMError`,
        `ToolError`, `ConfigError`, `MemoryError`, `RAGError`).

      ### B. `hello_agent/agents/` — first agent
      Per §6.3:
      - `agents/base.py` — `Agent` ABC + `AgentState` dataclass.
      - `agents/simple.py` — `SimpleAgent` (single-shot LLM call, no tools).
        Constructor takes `llm: LLMClient`, optional `system_prompt`.

      ### C. `hello_agent/cli/` — minimal CLI
      Per §6.12:
      - `cli/main.py` — `main()` entry, `argparse`-based subcommands.
        Subcommands: `chat`, `run`, `version`, `doctor`.
      - `cli/chat.py` — interactive REPL using `prompt_toolkit`. No tools
        (just SimpleAgent loop). Output via `rich`.
      - `cli/run.py` — single-turn, prints reply + exits. (Day 3 expands this.)

      ### D. `scripts/` — smoke tests
      - `scripts/smoke_core.py` — instantiate `LLMClient` from
        `config.yaml`, run a 1-token probe (`max_tokens=1`), assert no
        crash. Skip silently if `LLM_API_KEY` not set (CI mode).
      - `scripts/smoke_cli.py` — run `hello-agent chat "ping"` via
        `subprocess`, assert exit 0 and "pong"-ish in stdout.
        Accepts `--prompt` override.

      ### E. `tests/` — pytest scaffolding
      - `tests/__init__.py` (empty), `tests/conftest.py` (sets
        `HELLO_AGENT_PROFILE=test`, tmp HOME).
      - `tests/test_core/test_paths.py` — covers `get_hello_agent_home`
        with / without env override.
      - `tests/test_core/test_config.py` — load default config.yaml,
        assert no exceptions.
      - `tests/test_agents/test_simple.py` — mock LLMClient, assert
        SimpleAgent returns the mock's text.
      - (Optional) `tests/test_cli/test_version.py` — assert
        `hello-agent --version` returns 0.

      ## Workflow rules (user policies)

      1. **Smoke after each file, not at the end.** After writing any
         Python file in `hello_agent/`, run `uv run python -c "import
         hello_agent.X"` to make sure the import chain still works.
      2. **Use PowerShell, not bash heredoc.** `mkdir` / `New-Item`,
         `cat` / `Get-Content`, `rm` / `Remove-Item`. The user is on Windows.
      3. **Do not modify `pyproject.toml` dependencies** — they are
         already exact-pinned and locked. Adding a new dep needs user OK.
      4. **PLW1514 must be honored** — every `open()` call passes
         `encoding="utf-8"` explicitly.
      5. **No LangChain / LlamaIndex** — use stdlib + the listed deps only.
      6. **Day 1 does NOT include tools, context, memory, RAG, web UI,
         windows tray, MCP** — those are day 2-5. Don't expand scope.
      7. **Run ruff before commit:**
         `uv run ruff check hello_agent/ scripts/ tests/`
      8. **Commit & push at the end of Day 1**:
         ```
         git add -A
         git commit -m "feat(day1): core abstractions + SimpleAgent + CLI chat scaffold"
         git push origin wt/e5bdcb08
         ```
         Push goes through proxy; if it fails 3 times in a row, STOP and
         report the error to the verifier (don't burn retries — the
         monitor cron will pick it up).

      ## Deliverable
      1. All files listed in §A / §B / §C / §D / §E above exist and
         import cleanly.
      2. `uv run ruff check hello_agent/ scripts/ tests/` passes.
      3. `uv run python scripts/smoke_core.py` exits 0 (or skips cleanly
         if no API key).
      4. `uv run python scripts/smoke_cli.py --prompt "ping"` exits 0.
      5. `uv run pytest tests/test_core/ tests/test_agents/ -q` passes.
      6. `git log -1` shows the new day-1 commit on `wt/e5bdcb08`.
      7. `git log origin/wt/e5bdcb08..HEAD` is empty (push succeeded).

      Write a final report to
      `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\.mavis\plans\day1-scaffold-deliverable.md`
      listing: files created, smoke test outputs, pytest summary, the
      commit SHA, and any deviation from the spec.
    verify_prompt: |
      You are the **verifier** for Day 1 of hello-agent-2 v0.1.

      **Do NOT trust the producer's report. Re-run everything.**

      ## Working directory
      `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08`

      ## Verification checklist (all 12 must pass for PASS)

      1. **File existence** — every file in
         `core/{config,llm,types,logging,paths,exceptions}.py` +
         `agents/{base,simple}.py` + `cli/{main,chat,run}.py` +
         `scripts/{smoke_core,smoke_cli}.py` exists. Use
         `Get-ChildItem` not bash glob.

2. **Skeleton for future-day dirs is fine** — `hello_agent/` may
   already contain empty/stub `tools/`, `context/`, `memory/`,
   `rag/`, `protocols/`, `observability/`, `skills/`, `windows/`,
   `web/`. The user has explicitly approved this scaffold-ahead
   approach. Only FAIL if day 1's own code (core, agents/{base,simple},
   cli/{main,chat,run}, scripts, tests) is broken or missing.

      3. **Skeleton still imports** — `uv run python -c "import hello_agent"`
         exits 0. (The package's `__init__.py` calls
         `core.paths._apply_profile_override` — if that function is
         missing, this import fails. That alone is a FAIL.)

      4. **Core imports** — `uv run python -c "from hello_agent.core import config, llm, types, logging, paths, exceptions"` exits 0.

      5. **Agent imports** — `uv run python -c "from hello_agent.agents.base import Agent; from hello_agent.agents.simple import SimpleAgent"` exits 0.

      6. **CLI imports** — `uv run python -c "from hello_agent.cli.main import main; from hello_agent.cli.chat import chat; from hello_agent.cli.run import run"` exits 0.

      7. **CLI runs** — `uv run hello-agent --version` exits 0 and prints
         `hello-agent 0.1.0`.

      8. **Smoke core** — `uv run python scripts/smoke_core.py` exits 0
         (or prints a clear "no LLM_API_KEY, skipping" line and still
         exits 0). Anything else is FAIL.

      9. **Smoke CLI** — `uv run python scripts/smoke_cli.py --prompt "ping"`
         exits 0.

      10. **Ruff clean** — `uv run ruff check hello_agent/ scripts/ tests/`
          exits 0. Any PLW1514 violation in `hello_agent/` is auto-FAIL
          (tests/ can ignore per pyproject.toml).

      11. **Pytest passes** — `uv run pytest tests/test_core/ tests/test_agents/ -q`
          exits 0. At least 4 distinct test cases (one per
          `test_core/test_paths.py`, `test_core/test_config.py`,
          `test_agents/test_simple.py`, plus whatever the producer added).

      12. **Git state** —
          - `git log -1 --format='%H %s'` shows a day-1 commit.
          - `git log origin/wt/e5bdcb08..HEAD` is **empty** (push succeeded).
          - `git diff --stat HEAD~1` covers exactly the day-1 files
            (no `hello_agent/tools/`, no `hello_agent/memory/`, etc.).

      ## Failure handling
      If ANY item above fails, return **VERDICT: FAIL** with:
      - Which item(s) failed
      - Exact error output (last 30 lines)
      - Suggested fix (1-2 sentences)

      Otherwise return **VERDICT: PASS** with a 5-line summary of
      file count, ruff result, pytest result, commit SHA, and any
      spec deviations the producer flagged.

  - id: day2-tooling
    title: "Day 2 — Tool registry + builtin document_parser / file_tools / shell_tool + smoke"
    assigned_to: coder
    role: produce
    verified_by: verifier
    depends_on:
      - day1-scaffold
    gates: []
    max_retries: 2
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000
    prompt: |
      You are the producer for **Day 2** of the hello-agent-2 v0.1 plan.
      Day 1 is done; core + SimpleAgent + CLI chat exist on
      `wt/e5bdcb08`. Read
      `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\docs\ENGINEERING.md`
      §6.4 (tools) + §7.1 (MinerU + markitdown) BEFORE coding.

      ## What to build

      ### A. `hello_agent/tools/` — tool system
      Per §6.4:
      - `base.py` — `Tool` ABC, `@tool` decorator, schema-from-signature
        (use `inspect.signature` + `typing.get_type_hints`, emit JSON Schema
        for the LLM).
      - `registry.py` — `ToolRegistry` with `register()`, `unregister()`,
        `get()`, `list()`, `filter_by_profile(profile)`. Auto-discover
        builtins on `__init__` if `auto_discover=True`.
      - `response.py` — `ToolResponse` dataclass: `{success, data, error, hint}`.
      - `circuit_breaker.py` — `CircuitBreaker` (closed → open → half-open)
        with `failure_threshold`, `reset_timeout_ms`.
      - `permission.py` — `PermissionGate` with allowlist + per-session
        confirmation for `require_confirmation` tools (see
        `config.yaml tools.require_confirmation`).

      ### B. `hello_agent/tools/builtin/` — at least these 3 (Day 2 scope)
      - `document_parser.py` — MinerU 2.5 Pro → markitdown → plain text
        fallback chain. Reads `MINERU_API_KEY` / `MINERU_BASE_URL` /
        `MINERU_MODEL` from env. If no MinerU key, fall back to
        markitdown. If neither installed, return text error with hint.
        Accepts file path → returns markdown string.
      - `file_tools.py` — `read_file(path)`, `write_file(path, content)`,
        `edit_file(path, old, new)`. Use `encoding="utf-8"` on every
        `open()`. `write_file` / `edit_file` are in
        `tools.require_confirmation`.
      - `shell_tool.py` — `run_powershell(cmd)`, `run_cmd(cmd)`. Default
        timeout 60s, max output 50000 bytes (from config.yaml
        `terminal.shell_*`). Both in `require_confirmation`.

      ### C. `scripts/smoke_tools.py`
      - Smoke `ToolRegistry.register` / `get` / `list` round-trip.
      - Smoke `ToolResponse` shape (`success=True` path).
      - Smoke `CircuitBreaker` state transitions (mock tool that fails
        N times, then assert OPEN).
      - Smoke `document_parser` on a tiny inline markdown string (no
        real file I/O — just the fallback chain when MinerU is
        unavailable).
      - Smoke `file_tools.read_file` / `write_file` round-trip on a
        temp file.
      - Smoke `shell_tool.run_cmd "echo hello"` — assert stdout
        contains "hello".

      ### D. `tests/test_tools/`
      - `test_registry.py` — register / get / list / unregister.
      - `test_circuit_breaker.py` — state transitions.
      - `test_response.py` — ToolResponse serialization.
      - `test_file_tools.py` — round-trip read/write (uses tmp dir).
      - `test_shell_tool.py` — echo smoke.

      ## Workflow rules
      Same as Day 1 (PowerShell, ruff, smoke-after-each-file, no
      pyproject.toml dep changes without OK).

      ## Commit & push
      ```
      git add -A
      git commit -m "feat(day2): tool registry + circuit breaker + builtin document/file/shell tools"
      git push origin wt/e5bdcb08
      ```

      ## Deliverable
      1. All files in §A / §B / §C / §D exist + import cleanly.
      2. `uv run ruff check hello_agent/ scripts/ tests/` passes.
      3. `uv run python scripts/smoke_tools.py` exits 0.
      4. `uv run pytest tests/test_tools/ -q` passes (≥5 tests).
      5. New commit on `wt/e5bdcb08`, pushed to origin.
      6. Final report at
         `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\.mavis\plans\day2-tooling-deliverable.md`.
    verify_prompt: |
      You are the verifier for **Day 2** of hello-agent-2 v0.1.

      Working dir: `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08`

      ## Re-verify (don't trust producer)

      1. **All §A / §B files exist** — `tools/{base,registry,response,circuit_breaker,permission}.py`
         + `tools/builtin/{document_parser,file_tools,shell_tool}.py` + `__init__.py` for both.
2. **Skeleton for future-day dirs is fine** — `agents/`,
   `context/`, `memory/`, `rag/`, `protocols/`, `web/`, `windows/`
   may already exist as stubs. Only FAIL if day 2's own code
   (tools/, builtin/) is broken or missing.
      3. **Imports** — `uv run python -c "from hello_agent.tools import registry, base, response, circuit_breaker, permission; from hello_agent.tools.builtin import document_parser, file_tools, shell_tool"` exits 0.
      4. **Smoke** — `uv run python scripts/smoke_tools.py` exits 0.
      5. **Ruff clean** — `uv run ruff check hello_agent/ scripts/ tests/` exits 0.
      6. **Pytest** — `uv run pytest tests/test_tools/ -q` exits 0 with ≥5 tests collected.
      7. **Git** — new day-2 commit on `wt/e5bdcb08`, pushed to origin (no ahead-commits).
      8. **Day 1 still green** — re-run `uv run pytest tests/test_core/ tests/test_agents/ -q` to confirm Day 1 wasn't broken.
      9. **Permission wiring** — `file_tools.write_file`, `file_tools.edit_file`,
         `shell_tool.run_powershell`, `shell_tool.run_cmd` are in
         `tools.require_confirmation` per `config.yaml`.

      PASS = all 9 green. FAIL = list exactly which item(s) broke with
      error output.

  - id: day3-react-loop
    title: "Day 3 — ReAct / PlanAndSolve / Reflection agents + TaskRouter + CLI run + smoke"
    assigned_to: coder
    role: produce
    verified_by: verifier
    depends_on:
      - day2-tooling
    gates: []
    max_retries: 2
    timeout_ms: 1800000
    hang_alert_after_ms: 1500000
    prompt: |
      You are the producer for **Day 3** of hello-agent-2 v0.1.

      Read ENGINEERING.md §6.3 (agents) + §7.2 (advanced RAG
      retrieval — defer; only borrow the LLM-call pattern). Day 1-2
      already shipped: `core/`, `SimpleAgent`, `tools/` with
      registry + 3 builtins.

      ## What to build

      ### A. `hello_agent/agents/` — extend
      Per §6.3:
      - `react.py` — `ReActAgent` (DEFAULT agent type per
        `config.yaml agent.default_type: react`). Reasoning + acting
        loop. Up to `max_iterations` (30) tool calls per turn. Respects
        `PermissionGate` + `CircuitBreaker`. Stops on `final_answer` tool
        call or iteration cap.
      - `plan_solve.py` — `PlanAndSolveAgent`. First call LLM to plan
        (list of subtasks), then execute each in order.
      - `reflection.py` — `ReflectionAgent`. Execute → reflect → iterate
        up to N times.
      - `router.py` — `TaskRouter`. Classifies a user prompt (zero-shot
        via LLM) into one of {simple, react, plan_solve, reflection}
        and dispatches.

      ### B. `hello_agent/cli/run.py` — expand
      Add `--agent-type` flag (one of `simple|react|plan_solve|reflection`,
      default `react`). Without `--agent-type`, the router picks.

      ### C. `scripts/smoke_agents.py`
      - Smoke `SimpleAgent` with a mock LLM that returns a fixed string.
      - Smoke `ReActAgent` with a stubbed `ToolRegistry` containing a
        fake `final_answer` tool. Assert loop terminates.
      - Smoke `TaskRouter` with a mock LLM that returns "react" →
        assert dispatched agent type.

      ### D. `tests/test_agents/`
      - Extend `test_simple.py` with iteration loop test.
      - Add `test_react.py` — mock LLM that emits a tool_call then a
        final answer; assert ReActAgent terminates at 2 iterations.
      - Add `test_router.py` — mock LLM returns "react"; assert dispatch.

      ## Workflow
      Same as Day 1-2.

      ## Commit & push
      ```
      git add -A
      git commit -m "feat(day3): ReAct / PlanAndSolve / Reflection agents + TaskRouter + CLI run expansion"
      git push origin wt/e5bdcb08
      ```

      ## Deliverable
      1. All §A / §B / §C / §D files exist + import cleanly.
      2. `uv run ruff check hello_agent/ scripts/ tests/` passes.
      3. `uv run python scripts/smoke_agents.py` exits 0.
      4. `uv run hello-agent run --agent-type react "what is 2+2"` exits 0
         (allow non-zero if no API key, with a clear "no LLM_API_KEY,
         skipping" message; do NOT crash).
      5. `uv run pytest tests/test_agents/ -q` passes.
      6. Day 1-2 still green (re-run their test suites).
      7. New commit on `wt/e5bdcb08`, pushed to origin.
      8. Final report at
         `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08\.mavis\plans\day3-react-loop-deliverable.md`.
    verify_prompt: |
      Verifier for **Day 3** of hello-agent-2 v0.1.

      Working dir: `D:\Minimax-project\hello-agent-2\.worktrees\wt-e5bdcb08`

      ## Re-verify

